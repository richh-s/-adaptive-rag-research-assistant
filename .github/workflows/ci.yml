name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run obsolete; cancelling it keeps the queue short
# and the feedback fast. `main` is excluded from cancellation via the ref in the group key,
# so pushes there each get a complete run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Tests run fully offline; config just requires these to be present (blank is valid
      # for ANTHROPIC_API_KEY, and conftest overrides GOOGLE_API_KEY per test).
      GOOGLE_API_KEY: ci-test-key
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      # The threshold sits a few points under the current number so ordinary work isn't
      # blocked by noise, while a change that drops whole modules out of the suite fails.
      - name: Tests
        run: uv run pytest -q --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  # The Postgres-backed backends (conversations and the pgvector index) were previously
  # verifiable only on a developer machine, which meant the claim "swapping the backend
  # changes nothing observable" rested on whoever last remembered to run them locally. A
  # service container is cheap enough that it should not.
  postgres:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ci-test-key
      ANTHROPIC_API_KEY: ""
      RAG_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        # pgvector's own image rather than the stock postgres one: the vector extension has
        # to be installed in the server, and `CREATE EXTENSION` cannot conjure it.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra postgres
      # Named explicitly rather than running the whole suite: these two files are the ones
      # that skip without a database, so running them here is what turns a silent skip into
      # a real result.
      - name: Postgres-backed backends
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q --no-cov -rs \
            tests/test_postgres_store.py tests/test_pgvector_store.py | tee pg-tests.log
          # Both suites skip themselves when no database is reachable, which is correct on a
          # developer machine and useless here: without this check an unreachable service
          # container produces a green job that verified nothing at all.
          if grep -q "skipped" pg-tests.log; then
            echo "::error::Postgres suites skipped -- the service container was not reachable."
            exit 1
          fi
      # These two modules are omitted from the main coverage gate, which runs without a
      # database and would otherwise be measuring the absence of a service container. This is
      # where they are actually measured, against only their own line count.
      - name: Coverage gate for the Postgres-backed backends
        run: |
          uv run pytest -q \
            --cov-config=.coveragerc.postgres \
            --cov=rag_assistant.conversations.postgres_store \
            --cov=rag_assistant.retrieval.pgvector_store \
            --cov-report=term-missing --cov-fail-under=90 \
            tests/test_postgres_store.py tests/test_pgvector_store.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # Dependency vulnerabilities are a supply-chain problem that neither lint nor tests can
  # see, and the window that matters is "between the advisory and your next deploy". This
  # job is `continue-on-error` on purpose: a newly published advisory against a transitive
  # dependency should show up as a warning on every PR, not block unrelated work behind a
  # fix nobody has released yet. Promote it to blocking once someone owns triage.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Audit Python dependencies
        run: uvx pip-audit --disable-pip -r <(uv export --frozen --no-dev --no-emit-project --format requirements-txt)
        shell: bash
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  # The RAG quality gate. Separate from `backend` because it needs real API keys and real
  # model calls, so it cannot run on a fork PR -- the `if` skips it rather than failing it
  # when secrets aren't available, which keeps outside contributions green while still
  # gating every push to this repo.
  #
  # `eval --check` compares deterministic retrieval metrics against data/golden_eval/
  # baseline.json and exits non-zero on regression. It is what catches a prompt or chunking
  # change that quietly makes retrieval worse -- the class of bug that raises no exception
  # and fails no unit test, because the system keeps returning confident prose about the
  # wrong documents.
  eval:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      USE_CACHE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      # Two preconditions, reported rather than assumed. The gate needs real API keys (the
      # harness runs the actual graph) and a committed baseline to compare against. A fresh
      # clone has neither, and failing red on day one would train everyone to ignore this
      # job -- so it says precisely which precondition is missing and skips.
      - name: Check preconditions
        id: guard
        run: |
          if [ -z "${{ secrets.GOOGLE_API_KEY }}" ]; then
            echo "::notice::Eval gate skipped -- no GOOGLE_API_KEY secret configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f data/golden_eval/baseline.json ]; then
            echo "::warning::Eval gate skipped -- no baseline recorded. Run 'uv run rag-assistant eval --limit 50 --record-baseline' against a known-good build and commit data/golden_eval/baseline.json to turn the gate on."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Index the corpus
        if: steps.guard.outputs.enabled == 'true'
        run: uv run rag-assistant ingest
      - name: Eval gate
        if: steps.guard.outputs.enabled == 'true'
        run: |
          # Exit 2 means the gate could not run (no baseline, or one marked stale after a
          # change that invalidated it) -- reported as a warning rather than a failure,
          # because it is a signal to re-record deliberately with real keys, not evidence
          # that retrieval got worse. Exit 1, a real regression, still fails the build.
          set +e
          uv run rag-assistant eval --limit 50 --check
          status=$?
          set -e
          if [ "$status" = "2" ]; then
            echo "::warning::Eval gate could not run -- re-record the baseline with 'uv run rag-assistant eval --limit 50 --record-baseline'."
            exit 0
          fi
          exit $status

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rag-assistant:ci .
      # Scanning the built image catches what a manifest audit can't: vulnerable OS packages
      # in the base layer. Findings are reported, not enforced, for the same reason as above.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: rag-assistant:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"
      # A container that builds but crashes on boot is a green CI and a broken deploy. This
      # starts the real image and waits for the health endpoint the orchestrator will use.
      - name: Smoke-test the container
        run: |
          docker run -d --name rag-smoke -p 8000:8000 \
            -e GOOGLE_API_KEY=ci-test-key -e ANTHROPIC_API_KEY= \
            -e USE_CACHE=false rag-assistant:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "container healthy after ${attempt} attempt(s)"
              curl -fsS http://127.0.0.1:8000/metrics | head -5
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy; logs follow:"
          docker logs rag-smoke
          exit 1
      - name: Container logs
        if: always()
        run: docker logs rag-smoke || true
      - name: Stop container
        if: always()
        run: docker rm -f rag-smoke || true
