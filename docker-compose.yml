services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # Embedded Chroma is SQLite-backed, which locks the file to one process -- fine for a
      # single `api` replica today. Two ways out if this ever needs multiple replicas, neither
      # of which is sharing this volume: Chroma's server mode (a dedicated `chroma` service,
      # CHROMA_SERVER_HOST), or VECTOR_BACKEND=pgvector, which moves the index into the
      # `postgres` service below. Start that one with `docker compose --profile pgvector up`.
      - chroma_data:/app/chroma_db
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # /ready (not /health) on purpose: it pings Chroma and the web-search backend, so a
    # container that is up but can't actually serve a research request reports unhealthy
    # instead of sitting in the rotation returning errors. start_period covers the baseline
    # corpus indexing the image runs at boot.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready').read()"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Behind a profile so the default `docker compose up` stays two services and needs no
  # configuration. `docker compose --profile pgvector up` starts it; the api then needs
  # VECTOR_BACKEND=pgvector and DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
  # in .env -- psycopg is already in the image, so no rebuild is needed.
  postgres:
    # pgvector's image rather than stock postgres: the `vector` extension has to exist in the
    # server before CREATE EXTENSION can enable it.
    image: pgvector/pgvector:pg17
    profiles: ["pgvector"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chroma_data:
  redis_data:
  postgres_data:
