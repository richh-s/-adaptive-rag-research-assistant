services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # Embedded Chroma is SQLite-backed, which locks the file to one process -- fine for a
      # single `api` replica today. If this ever needs multiple replicas, migrate to Chroma's
      # server mode (a dedicated `chroma` service here, with vector_store.py switched from a
      # local persist_directory to chromadb.HttpClient) instead of sharing this volume.
      - chroma_data:/app/chroma_db
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # /ready (not /health) on purpose: it pings Chroma and the web-search backend, so a
    # container that is up but can't actually serve a research request reports unhealthy
    # instead of sitting in the rotation returning errors. start_period covers the baseline
    # corpus indexing the image runs at boot.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready').read()"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  chroma_data:
  redis_data:
